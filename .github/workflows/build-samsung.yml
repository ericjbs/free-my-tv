name: Build Samsung
on:
  workflow_dispatch:
    inputs:
      city:
        description: Cidade (nome no card do clima)
        default: São Paulo
      latitude:
        description: Latitude
        default: "-23.55"
      longitude:
        description: Longitude
        default: "-46.63"
      region:
        description: País (2 letras)
        default: BR
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Tizen CLI
        run: |
          curl -fL -o tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_5.6/web-cli_Tizen_Studio_5.6_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "$HOME/tizen-studio"
      - name: Configuração
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CITY: ${{ inputs.city }}
          LAT: ${{ inputs.latitude }}
          LON: ${{ inputs.longitude }}
          REGION: ${{ inputs.region }}
        run: |
          cat > config.properties <<EOT
          tmdb_key=$TMDB_KEY
          tmdb_region=$REGION
          latitude=$LAT
          longitude=$LON
          city=$CITY
          language=pt
          show_crypto=false
          temperature=C
          EOT
      - name: Certificado e assinatura
        env:
          PW: ${{ secrets.CERT_PASSWORD }}
        run: |
          sudo apt-get install -y expect > /dev/null
          S="$HOME/tizen-studio"
          D="$HOME/tizen-studio-data"
          export T="$S/tools/ide/bin/tizen"
          "$T" certificate -a fmtv -p "$PW" -c BR -s SP -ct "Sao Paulo" -o FreeMyTV -n FreeMyTV -e fmtv@example.com -f fmtv
          "$T" cli-config "profiles.path=$D/profile/profiles.xml"
          "$T" security-profiles add -n fmtv -a "$D/keystore/author/fmtv.p12" -p "$PW"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          p = os.path.expanduser('~/tizen-studio-data/profile/profiles.xml')
          t = ET.parse(p)
          for i in t.iter('profileitem'):
              d = i.get('distributor')
              if d == '0':
                  i.set('password', os.environ['PW'])
              elif d == '1':
                  i.set('password', 'tizenpkcs12passfordsigner')
          t.write(p, encoding='UTF-8', xml_declaration=True)
          PY
          python3 tizen/build.py
          mkdir out-signed
          cat > sign.exp <<'EOT'
          set timeout -1
          spawn $env(T) package -t wgt -s fmtv -o out-signed -- FreeMyTV-tizen.wgt
          expect eof
          catch wait result
          exit [lindex $result 3]
          EOT
          expect sign.exp || { cat "$D/cli/logs/cli.log" || true; exit 1; }
          cp out-signed/*.wgt FreeMyTV-tizen.wgt
          unzip -l FreeMyTV-tizen.wgt | grep -i signature
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: FreeMyTV-tizen.wgt
          make_latest: true
